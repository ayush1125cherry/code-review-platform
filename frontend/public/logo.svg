<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Blue / purple gradient -->
    <linearGradient id="blueGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="45%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Green check gradient -->
    <linearGradient id="greenGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>

    <!-- Code gradient -->
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Glass gradient -->
    <radialGradient id="glassGrad" cx="35%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8"/>
      <stop offset="55%" stop-color="#2563EB" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.9"/>
    </radialGradient>

    <!-- Glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shadow -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Back rounded-square layer -->
  <rect
    x="15"
    y="12"
    width="70"
    height="70"
    rx="15"
    stroke="url(#blueGrad)"
    stroke-width="3"
    opacity="0.9"
  />

  <!-- Main code editor -->
  <rect
    x="19"
    y="20"
    width="62"
    height="58"
    rx="10"
    fill="#101A3A"
    stroke="url(#blueGrad)"
    stroke-width="2.2"
    filter="url(#shadow)"
  />

  <!-- Editor top bar -->
  <circle cx="27" cy="28" r="2.2" fill="#EF4444"/>
  <circle cx="34" cy="28" r="2.2" fill="#FACC15"/>
  <circle cx="41" cy="28" r="2.2" fill="#22C55E"/>

  <!-- Code lines -->
  <rect x="27" y="36" width="25" height="2.8" rx="1.4" fill="#22D3EE"/>
  <rect x="55" y="36" width="13" height="2.8" rx="1.4" fill="#8B5CF6"/>

  <!-- Code brackets -->
  <path
    d="M38 42 L32 48 L38 54"
    stroke="#38BDF8"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <path
    d="M46 42 L52 48 L46 54"
    stroke="#22D3EE"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- More code -->
  <rect x="27" y="59" width="19" height="2.8" rx="1.4" fill="#2563EB"/>
  <rect x="49" y="59" width="14" height="2.8" rx="1.4" fill="#FACC15"/>

  <rect x="27" y="65" width="28" height="2.8" rx="1.4" fill="#6366F1"/>
  <rect x="58" y="65" width="9" height="2.8" rx="1.4" fill="#22D3EE"/>

  <!-- Magnifying glass -->
  <circle
    cx="65"
    cy="52"
    r="15"
    fill="url(#glassGrad)"
    stroke="url(#blueGrad)"
    stroke-width="3"
    filter="url(#shadow)"
  />

  <!-- Glass reflection -->
  <path
    d="M56 44 C59 40 64 39 68 40"
    stroke="#FFFFFF"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.75"
  />

  <!-- Magnifying glass handle -->
  <path
    d="M75 63 L86 76"
    stroke="#2563EB"
    stroke-width="7"
    stroke-linecap="round"
  />

  <path
    d="M75 63 L86 76"
    stroke="#60A5FA"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.7"
  />

  <!-- Check badge -->
  <circle
    cx="38"
    cy="73"
    r="11"
    fill="url(#greenGrad)"
    stroke="#22C55E"
    stroke-width="2"
    filter="url(#shadow)"
  />

  <!-- Checkmark -->
  <path
    d="M32 73 L36 77 L44 68"
    stroke="#FFFFFF"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Small decorative glow -->
  <circle cx="80" cy="25" r="1.8" fill="#38BDF8" opacity="0.9"/>
  <circle cx="22" cy="80" r="1.3" fill="#8B5CF6" opacity="0.8"/>
  <circle cx="78" cy="80" r="1" fill="#22D3EE" opacity="0.7"/>
</svg>
